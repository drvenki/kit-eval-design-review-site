<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1010" width="1040" height="1010"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
     role="img" aria-labelledby="t d">
<title id="t">Study schematic: benchmarking seven library-preparation kits</title>
<desc id="d">A top-to-bottom flowchart of the study. Three pooled DNA sources (cfDNA, gDNA, FFPE)
feed four input conditions (cfDNA 30 ng with six kits, gDNA 150 ng, FFPE 25 ng and FFPE 150 ng with
five kits each). Each kit and input condition was prepared as three batches of three technical
replicates, giving 189 analysed libraries. All libraries went through one target capture, one
sequencing run downsampled to 35 million read pairs, and one bioinformatic pipeline with duplex
consensus calling, before five endpoints were measured and analysed with a batch-level mixed
model. Side notes record the nesting structure, the four libraries excluded for capture failure,
and the two structural confounds.</desc>

<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b96a3"/>
  </marker>
</defs>

<rect width="1040" height="1010" fill="#ffffff"/>

<text x="40" y="36" font-size="19" font-weight="700" fill="#1a1d21">Benchmarking seven DNA library-preparation kits</text>
<text x="40" y="57" font-size="12.5" fill="#5b6672">Targeted UMI / duplex sequencing on the ProBio panel · 189 analysed libraries · four input conditions analysed separately</text>

<!-- ============ stage labels ============ -->
<g font-size="10.5" font-weight="700" fill="#5b6672" text-anchor="end" letter-spacing="1">
  <text x="136" y="122">DNA SOURCE</text>
  <text x="136" y="222">INPUT CONDITION</text>
  <text x="136" y="350">LIBRARY PREP</text>
  <text x="136" y="480">TARGET CAPTURE</text>
  <text x="136" y="580">SEQUENCING</text>
  <text x="136" y="684">BIOINFORMATICS</text>
  <text x="136" y="800">ENDPOINTS</text>
  <text x="136" y="918">ANALYSIS</text>
</g>

<!-- ============ 1. DNA sources ============ -->
<g>
  <rect x="160" y="80" width="192" height="76" rx="5" fill="#f4f7fa" stroke="#dde3ea"/>
  <text x="256" y="106" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="middle">cfDNA</text>
  <text x="256" y="125" font-size="11.5" fill="#5b6672" text-anchor="middle">one pool, leftover plasma</text>
  <text x="256" y="141" font-size="11.5" fill="#5b6672" text-anchor="middle">from ProBio participants</text>

  <rect x="364" y="80" width="192" height="76" rx="5" fill="#f4f7fa" stroke="#dde3ea"/>
  <text x="460" y="106" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="middle">gDNA</text>
  <text x="460" y="125" font-size="11.5" fill="#5b6672" text-anchor="middle">one pool, two blood donors</text>
  <text x="460" y="141" font-size="11.5" fill="#5b6672" text-anchor="middle">9610 ng, NucleoSpin Blood Mini</text>

  <rect x="568" y="80" width="192" height="76" rx="5" fill="#f4f7fa" stroke="#dde3ea"/>
  <text x="664" y="106" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="middle">FFPE</text>
  <text x="664" y="125" font-size="11.5" fill="#5b6672" text-anchor="middle">one pool, nine blocks</text>
  <text x="664" y="141" font-size="11.5" fill="#5b6672" text-anchor="middle">1–4 years old, AllPrep FFPE</text>
</g>
<line x1="460" y1="156" x2="460" y2="180" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 2. Input conditions ============ -->
<g>
  <rect x="160" y="184" width="142" height="68" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/>
  <text x="231" y="212" font-size="12.5" font-weight="700" fill="#0b5fa5" text-anchor="middle">cfDNA 30 ng</text>
  <text x="231" y="232" font-size="11.5" fill="#5b6672" text-anchor="middle">6 kits</text>

  <rect x="312" y="184" width="142" height="68" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/>
  <text x="383" y="212" font-size="12.5" font-weight="700" fill="#0b5fa5" text-anchor="middle">gDNA 150 ng</text>
  <text x="383" y="232" font-size="11.5" fill="#5b6672" text-anchor="middle">5 kits</text>

  <rect x="464" y="184" width="142" height="68" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/>
  <text x="535" y="212" font-size="12.5" font-weight="700" fill="#0b5fa5" text-anchor="middle">FFPE 25 ng</text>
  <text x="535" y="232" font-size="11.5" fill="#5b6672" text-anchor="middle">5 kits</text>

  <rect x="616" y="184" width="144" height="68" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/>
  <text x="688" y="212" font-size="12.5" font-weight="700" fill="#0b5fa5" text-anchor="middle">FFPE 150 ng</text>
  <text x="688" y="232" font-size="11.5" fill="#5b6672" text-anchor="middle">5 kits</text>
</g>
<line x1="460" y1="252" x2="460" y2="276" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 3. Library preparation ============ -->
<g>
  <rect x="160" y="280" width="600" height="132" rx="5" fill="#ffffff" stroke="#dde3ea"/>
  <text x="176" y="304" font-size="13" font-weight="700" fill="#1a1d21">Library preparation — seven kits, not all used in every input condition</text>
  <g font-size="11" text-anchor="middle">
    <rect x="173" y="316" width="76" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="211" y="332" fill="#1a1d21">KAPA15</text>
    <rect x="256" y="316" width="76" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="294" y="332" fill="#1a1d21">KAPAON</text>
    <rect x="339" y="316" width="90" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="384" y="332" fill="#1a1d21">KAPAON-COV</text>
    <rect x="436" y="316" width="60" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="466" y="332" fill="#1a1d21">EVO</text>
    <rect x="503" y="316" width="60" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="533" y="332" fill="#1a1d21">WM</text>
    <rect x="570" y="316" width="70" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="605" y="332" fill="#1a1d21">TWIST</text>
    <rect x="647" y="316" width="60" height="24" rx="12" fill="#f5f6f8" stroke="#dde3ea"/><text x="677" y="332" fill="#1a1d21">IL</text>
  </g>
  <text x="176" y="366" font-size="12" fill="#1a1d21">For every kit × input condition: <tspan font-weight="700">3 preparation batches</tspan> on separate occasions,</text>
  <text x="176" y="384" font-size="12" fill="#1a1d21">each with <tspan font-weight="700">3 technical replicates</tspan> from the same DNA aliquot → 9 libraries.</text>
  <text x="176" y="402" font-size="11.5" fill="#5b6672">Replicate ⊂ batch ⊂ (kit × input condition). Batch is nested in kit, not crossed with it.</text>
</g>
<line x1="460" y1="412" x2="460" y2="436" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 4. Capture ============ -->
<g>
  <rect x="160" y="440" width="600" height="72" rx="5" fill="#eaf5ee" stroke="#c2ddcc"/>
  <text x="176" y="464" font-size="13" font-weight="700" fill="#1f6b3a">Target capture — not confounded with kit</text>
  <text x="176" y="484" font-size="12" fill="#1a1d21">ProBio SNV/indel panel (S3), Twist Target Enrichment Standard hybridisation v1,</text>
  <text x="176" y="502" font-size="12" fill="#1a1d21">single hybridisation date, every library captured by one operator.</text>
</g>
<line x1="460" y1="512" x2="460" y2="536" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 5. Sequencing ============ -->
<g>
  <rect x="160" y="540" width="600" height="72" rx="5" fill="#eaf5ee" stroke="#c2ddcc"/>
  <text x="176" y="564" font-size="13" font-weight="700" fill="#1f6b3a">Sequencing — not confounded with kit</text>
  <text x="176" y="584" font-size="12" fill="#1a1d21">NovaSeq X, three flow cells; libraries pooled and spread across lanes.</text>
  <text x="176" y="602" font-size="12" fill="#1a1d21">Every library downsampled to <tspan font-weight="700">35 M read pairs</tspan> before metrics were collected.</text>
</g>
<line x1="460" y1="612" x2="460" y2="636" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 6. Pipeline ============ -->
<g>
  <rect x="160" y="640" width="600" height="80" rx="5" fill="#ffffff" stroke="#dde3ea"/>
  <text x="176" y="664" font-size="13" font-weight="700" fill="#1a1d21">One bioinformatic pipeline for every library</text>
  <text x="176" y="684" font-size="11.5" fill="#5b6672">adapter trim → bwa + UMI extraction → indel realignment → group reads by UMI →</text>
  <text x="176" y="702" font-size="11.5" fill="#5b6672">duplex consensus calling → filter (single-strand agreement required) → clip overlaps</text>
</g>
<line x1="460" y1="720" x2="460" y2="744" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 7. Endpoints ============ -->
<g>
  <rect x="160" y="748" width="600" height="96" rx="5" fill="#ffffff" stroke="#dde3ea"/>
  <text x="176" y="772" font-size="13" font-weight="700" fill="#1a1d21">Five endpoints compared across kits</text>
  <g font-size="11" text-anchor="middle">
    <rect x="173" y="784" width="112" height="26" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/><text x="229" y="801" fill="#0b5fa5">Conversion rate</text>
    <rect x="292" y="784" width="112" height="26" rx="5" fill="#f5f6f8" stroke="#dde3ea"/><text x="348" y="801" fill="#1a1d21">Coverage depth</text>
    <rect x="411" y="784" width="112" height="26" rx="5" fill="#f5f6f8" stroke="#dde3ea"/><text x="467" y="801" fill="#1a1d21">GC bias</text>
    <rect x="530" y="784" width="112" height="26" rx="5" fill="#f5f6f8" stroke="#dde3ea"/><text x="586" y="801" fill="#1a1d21">Background error</text>
    <rect x="649" y="784" width="98" height="26" rx="5" fill="#f5f6f8" stroke="#dde3ea"/><text x="698" y="801" fill="#1a1d21">FFPE artifacts</text>
  </g>
  <text x="176" y="832" font-size="11.5" fill="#5b6672">Conversion rate = unique molecules recovered at 35 M read pairs ÷ genome copies in the input.</text>
</g>
<line x1="460" y1="844" x2="460" y2="868" stroke="#8b96a3" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- ============ 8. Analysis ============ -->
<g>
  <rect x="160" y="872" width="600" height="84" rx="5" fill="#e8f1fa" stroke="#c3d8ec"/>
  <text x="176" y="896" font-size="13" font-weight="700" fill="#0b5fa5">Statistical analysis — the batch is the experimental unit</text>
  <text x="176" y="917" font-size="12" fill="#1a1d21" font-family="ui-monospace,Menlo,Consolas,monospace">logit(conversion rate) ~ kit + (1 | kit:batch)</text>
  <text x="176" y="938" font-size="11.5" fill="#5b6672">REML, Kenward–Roger denominator df, Holm-adjusted pairwise contrasts on batch means, Hedges' g.</text>
</g>

<!-- ============ side notes ============ -->
<g>
  <rect x="790" y="280" width="220" height="106" rx="5" fill="#fdf1e7" stroke="#e8cdb4"/>
  <text x="804" y="302" font-size="10.5" font-weight="700" fill="#b3541e" letter-spacing="1">NOT NINE INDEPENDENT POINTS</text>
  <text x="804" y="322" font-size="11.5" fill="#1a1d21">The three replicates in a batch</text>
  <text x="804" y="338" font-size="11.5" fill="#1a1d21">share operator, reagent lot, plate</text>
  <text x="804" y="354" font-size="11.5" fill="#1a1d21">and capture pool. Median ICC of</text>
  <text x="804" y="370" font-size="11.5" fill="#1a1d21">conversion rate is 0.46.</text>

  <rect x="790" y="400" width="220" height="106" rx="5" fill="#fbecec" stroke="#e3bcbc"/>
  <text x="804" y="422" font-size="10.5" font-weight="700" fill="#a32020" letter-spacing="1">EXCLUDED: CAPTURE FAILURE</text>
  <text x="804" y="442" font-size="11.5" fill="#1a1d21">Four libraries yielded no usable</text>
  <text x="804" y="458" font-size="11.5" fill="#1a1d21">sequencing data and are absent</text>
  <text x="804" y="474" font-size="11.5" fill="#1a1d21">from every metric, so n = 8 rather</text>
  <text x="804" y="490" font-size="11.5" fill="#1a1d21">than 9 in four of the 21 groups.</text>

  <rect x="790" y="520" width="220" height="140" rx="5" fill="#fdf1e7" stroke="#e8cdb4"/>
  <text x="804" y="542" font-size="10.5" font-weight="700" fill="#b3541e" letter-spacing="1">STRUCTURAL CONFOUNDS</text>
  <text x="804" y="562" font-size="11.5" fill="#1a1d21">Operator is aliased with kit, so an</text>
  <text x="804" y="578" font-size="11.5" fill="#1a1d21">operator effect cannot be estimated.</text>
  <text x="804" y="598" font-size="11.5" fill="#1a1d21">One kit's three gDNA/FFPE batches</text>
  <text x="804" y="614" font-size="11.5" fill="#1a1d21">were all prepared on one day, so its</text>
  <text x="804" y="630" font-size="11.5" fill="#1a1d21">between-batch variance is not</text>
  <text x="804" y="646" font-size="11.5" fill="#1a1d21">comparable with the others'.</text>
</g>

<text x="40" y="988" font-size="11" fill="#5b6672">All replication is technical: one pooled DNA preparation per matrix type, so the estimates do not cover donor-to-donor or block-to-block variability.</text>
</svg>
